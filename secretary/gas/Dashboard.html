<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>秘書AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #F3F4F7;
  --paper: #FFFFFF;
  --paper-2: #F7F8FA;
  --ink: #1D2127;
  --ink-2: #545B67;
  --ink-3: #8A909B;
  --line: rgba(20, 28, 45, 0.08);
  --line-2: rgba(20, 28, 45, 0.14);
  --hover: rgba(20, 28, 45, 0.045);
  --accent: #2F6BE4;
  --accent-soft: rgba(47, 107, 228, 0.10);
  --accent-ink: #FFFFFF;
  --red: #D23F45;   --red-soft: rgba(210, 63, 69, 0.10);
  --amber: #B97309; --amber-soft: rgba(214, 142, 20, 0.13);
  --green: #1D8A5B; --green-soft: rgba(29, 138, 91, 0.11);
  --glass: linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,255,255,0.56));
  --glass-strong: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.8));
  --glass-edge: rgba(255, 255, 255, 0.75);
  --glass-shadow: 0 1px 1px rgba(20,28,45,0.04), 0 10px 30px rgba(20,28,45,0.08);
  --spec: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.35);
  --blob-1: rgba(120, 170, 255, 0.35);
  --blob-2: rgba(110, 215, 180, 0.28);
  --blob-3: rgba(255, 190, 150, 0.26);
  /* Notion 風タグ色（背景 / 文字） */
  --t-gray-bg: #EDEDEB; --t-gray: #5A5A57;
  --t-brown-bg: #EEE2DA; --t-brown: #7A5540;
  --t-orange-bg: #FADEC9; --t-orange: #9A4A12;
  --t-yellow-bg: #F9EBC4; --t-yellow: #7C5B06;
  --t-green-bg: #DBEDDB; --t-green: #2D6A3E;
  --t-blue-bg: #D8E6F7; --t-blue: #1F5596;
  --t-purple-bg: #E8DEEE; --t-purple: #62407E;
  --t-pink-bg: #F5E0E9; --t-pink: #8C3558;
  --t-red-bg: #FFE2DD; --t-red: #9B2C23;
  --radius: 14px;
  --font: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111317; --paper: #1A1D22; --paper-2: #16181C;
    --ink: #E9EBEF; --ink-2: #A9AFBA; --ink-3: #737A86;
    --line: rgba(255,255,255,0.08); --line-2: rgba(255,255,255,0.14); --hover: rgba(255,255,255,0.05);
    --accent: #6C9CFF; --accent-soft: rgba(108,156,255,0.16); --accent-ink: #0E1420;
    --red: #FF6B6F; --red-soft: rgba(255,107,111,0.15);
    --amber: #F0B04A; --amber-soft: rgba(240,176,74,0.15);
    --green: #4CC38A; --green-soft: rgba(76,195,138,0.15);
    --glass: linear-gradient(180deg, rgba(40,44,52,0.72), rgba(28,31,37,0.56));
    --glass-strong: linear-gradient(180deg, rgba(44,48,56,0.94), rgba(30,33,39,0.9));
    --glass-edge: rgba(255,255,255,0.10);
    --glass-shadow: 0 1px 1px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.35);
    --spec: inset 0 1px 0 rgba(255,255,255,0.12), inset 0 -1px 0 rgba(255,255,255,0.03);
    --blob-1: rgba(70, 110, 220, 0.30); --blob-2: rgba(40, 150, 120, 0.22); --blob-3: rgba(200, 120, 80, 0.18);
    --t-gray-bg: #373737; --t-gray: #CFCFCF; --t-brown-bg: #4A3A30; --t-brown: #E6CDBB;
    --t-orange-bg: #5C3B23; --t-orange: #F5C8A5; --t-yellow-bg: #564A26; --t-yellow: #F1DD9B;
    --t-green-bg: #2B4632; --t-green: #B7E0BF; --t-blue-bg: #243C5A; --t-blue: #B6D2F5;
    --t-purple-bg: #3F3150; --t-purple: #DCC8EE; --t-pink-bg: #4E2C3C; --t-pink: #F2C3D6;
    --t-red-bg: #5A2A26; --t-red: #FFC4BC;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111317; --paper: #1A1D22; --paper-2: #16181C;
  --ink: #E9EBEF; --ink-2: #A9AFBA; --ink-3: #737A86;
  --line: rgba(255,255,255,0.08); --line-2: rgba(255,255,255,0.14); --hover: rgba(255,255,255,0.05);
  --accent: #6C9CFF; --accent-soft: rgba(108,156,255,0.16); --accent-ink: #0E1420;
  --red: #FF6B6F; --red-soft: rgba(255,107,111,0.15);
  --amber: #F0B04A; --amber-soft: rgba(240,176,74,0.15);
  --green: #4CC38A; --green-soft: rgba(76,195,138,0.15);
  --glass: linear-gradient(180deg, rgba(40,44,52,0.72), rgba(28,31,37,0.56));
  --glass-strong: linear-gradient(180deg, rgba(44,48,56,0.94), rgba(30,33,39,0.9));
  --glass-edge: rgba(255,255,255,0.10);
  --glass-shadow: 0 1px 1px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.35);
  --spec: inset 0 1px 0 rgba(255,255,255,0.12), inset 0 -1px 0 rgba(255,255,255,0.03);
  --blob-1: rgba(70, 110, 220, 0.30); --blob-2: rgba(40, 150, 120, 0.22); --blob-3: rgba(200, 120, 80, 0.18);
  --t-gray-bg: #373737; --t-gray: #CFCFCF; --t-brown-bg: #4A3A30; --t-brown: #E6CDBB;
  --t-orange-bg: #5C3B23; --t-orange: #F5C8A5; --t-yellow-bg: #564A26; --t-yellow: #F1DD9B;
  --t-green-bg: #2B4632; --t-green: #B7E0BF; --t-blue-bg: #243C5A; --t-blue: #B6D2F5;
  --t-purple-bg: #3F3150; --t-purple: #DCC8EE; --t-pink-bg: #4E2C3C; --t-pink: #F2C3D6;
  --t-red-bg: #5A2A26; --t-red: #FFC4BC;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.65 var(--font); -webkit-font-smoothing: antialiased;
  font-feature-settings: "palt" 1;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono, .num { font-family: var(--font); font-variant-numeric: tabular-nums; }
.num { font-size: 0.94em; }
[hidden] { display: none !important; }

/* 背景の環境光（ガラス越しに色がにじむ） */
.ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.ambient i { position: absolute; border-radius: 50%; filter: blur(70px); }
.ambient i:nth-child(1) { width: 520px; height: 520px; left: -120px; top: -160px; background: var(--blob-1); }
.ambient i:nth-child(2) { width: 460px; height: 460px; right: -140px; top: 18%; background: var(--blob-2); }
.ambient i:nth-child(3) { width: 520px; height: 420px; left: 30%; bottom: -220px; background: var(--blob-3); }
@media (prefers-reduced-motion: no-preference) {
  .ambient i { animation: drift 28s ease-in-out infinite alternate; }
  .ambient i:nth-child(2) { animation-duration: 34s; }
  .ambient i:nth-child(3) { animation-duration: 40s; }
}
@keyframes drift { to { transform: translate(40px, 30px) scale(1.06); } }

/* Liquid Glass */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(26px) saturate(185%);
  backdrop-filter: blur(26px) saturate(185%);
  border: 1px solid var(--glass-edge);
  box-shadow: var(--spec), var(--glass-shadow);
  position: relative;
}
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(120% 60% at 20% 0%, rgba(255,255,255,0.35), transparent 55%);
  mix-blend-mode: soft-light;
}

/* レイアウト */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100%; }
.sidebar {
  position: sticky; top: 12px; margin: 12px 0 12px 12px; height: calc(100vh - 24px);
  border-radius: 22px; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; overflow: auto;
}
.ws { display: flex; align-items: center; gap: 10px; padding: 6px 10px 14px; }
.ws-mark {
  width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  background: var(--ink); color: var(--paper); font-weight: 700; font-size: 13px; letter-spacing: 0.02em;
}
.ws-name { font-weight: 700; font-size: 15px; line-height: 1.2; }
.ws-sub { font-size: 11.5px; color: var(--ink-3); }
.nav-label { font-size: 11px; font-weight: 500; color: var(--ink-3); letter-spacing: 0.06em; padding: 14px 10px 4px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 9px; cursor: pointer;
  color: var(--ink-2); border: 0; background: none; width: 100%; text-align: left; font-size: 14px;
}
.nav-item:hover { background: var(--hover); }
.nav-item.active { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.nav-item svg { width: 18px; height: 18px; flex: none; }
.nav-item .count { margin-left: auto; font-family: var(--font); font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--ink-3); }
.nav-item .count.hot { color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 0 7px; }
.nav-proj { font-size: 13.5px; padding-left: 14px; }
.nav-proj .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.side-foot { margin-top: auto; padding: 10px; font-size: 11.5px; color: var(--ink-3); display: grid; gap: 6px; }

.main { min-width: 0; padding: 12px 20px 120px; }
.topbar {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 20;
  display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 16px; border-radius: 16px; margin-bottom: 18px;
}
.crumb { font-size: 13.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumb b { color: var(--ink); font-weight: 500; }
.spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--paper);
  border-radius: 10px; padding: 5px 11px; cursor: pointer; font-size: 13px; white-space: nowrap; line-height: 1.5;
}
.btn:hover { background: var(--paper-2); }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { padding: 3px 9px; font-size: 12.5px; border-radius: 8px; }
.btn.danger { color: var(--red); }
.kbd { font-family: var(--mono); font-size: 11px; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 0 5px; }
.search-btn { min-width: 200px; justify-content: flex-start; color: var(--ink-3); background: var(--paper-2); }
.search-btn .kbd { margin-left: auto; }

.page { max-width: 980px; margin: 0 auto; }
.page-head { padding: 26px 4px 8px; }
.page-icon { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; margin-bottom: 12px; }
.page-icon svg { width: 26px; height: 26px; }
.page-title { font-size: 30px; font-weight: 700; line-height: 1.25; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
.page-sub { color: var(--ink-2); margin-top: 6px; font-size: 14px; }
.props { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 4px 12px; margin: 16px 0 6px; font-size: 13.5px; }
.props dt { color: var(--ink-3); display: flex; align-items: center; gap: 6px; padding: 3px 0; }
.props dd { margin: 0; padding: 3px 0; min-width: 0; }
.divider { height: 1px; background: var(--line); margin: 14px 0; }

.section { margin-top: 26px; }
.section-h { display: flex; align-items: center; gap: 8px; margin: 0 4px 8px; }
.section-h h2 { font-size: 15px; font-weight: 700; margin: 0; }
.section-h .meta { color: var(--ink-3); font-size: 12.5px; }
.section-h .spacer + .btn, .section-h .btn { margin-left: auto; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); }
.card.pad { padding: 16px 18px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; }

/* ブリーフ */
.brief { border-radius: 20px; padding: 18px 22px; }
.brief-h { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.page-sub svg.inl { width: 13px; height: 13px; vertical-align: -2px; color: var(--accent); }
.brief-h svg { width: 17px; height: 17px; color: var(--accent); }
.brief-h .meta { font-weight: 400; color: var(--ink-3); font-size: 12px; margin-left: auto; }
.brief .md h2 { font-size: 13px; color: var(--ink-2); margin: 14px 0 4px; letter-spacing: 0.02em; }
.brief .md { column-width: 340px; column-gap: 32px; }
.brief .md h2 { break-after: avoid; }
.brief .md ul { break-inside: avoid-column; }

/* 数字タイル */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.stat {
  text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius);
  padding: 12px 14px; cursor: pointer; display: grid; gap: 2px;
}
.stat:hover { border-color: var(--line-2); }
.stat .lbl { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.stat .val { font-family: var(--font); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 500; line-height: 1.2; }
.stat .val small { font-size: 12px; color: var(--ink-3); font-family: var(--font); margin-left: 4px; }
.stat.is-red .val { color: var(--red); }
.stat.is-accent .val { color: var(--accent); }
.sdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* リスト行（Notion データベース風） */
.rows { display: grid; }
.row {
  display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 8px;
  padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; min-height: 44px;
}
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--hover); }
.row-main { min-width: 0; }
.row-title { font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
.row-sub { font-size: 12px; color: var(--ink-3); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.row > span > svg { display: block; }
.row-sub svg { width: 13px; height: 13px; vertical-align: -2px; }
.row-end { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.row.done .row-title { color: var(--ink-3); text-decoration: line-through; }
.group-h { font-size: 12px; font-weight: 500; color: var(--ink-2); padding: 12px 12px 4px; display: flex; gap: 8px; align-items: center; }
.group-h .n { font-family: var(--font); font-variant-numeric: tabular-nums; color: var(--ink-3); }

.check {
  width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--ink-3); background: transparent;
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.check:hover { border-color: var(--accent); }
.check.on { background: var(--accent); border-color: var(--accent); }
.check.on::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--accent-ink); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }

.chip {
  display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 0 7px; font-size: 12px;
  line-height: 20px; white-space: nowrap; background: var(--t-gray-bg); color: var(--t-gray); max-width: 100%;
  overflow: hidden; text-overflow: ellipsis;
}
.chip.c-blue { background: var(--t-blue-bg); color: var(--t-blue); }
.chip.c-orange { background: var(--t-orange-bg); color: var(--t-orange); }
.chip.c-purple { background: var(--t-purple-bg); color: var(--t-purple); }
.chip.c-green { background: var(--t-green-bg); color: var(--t-green); }
.chip.c-yellow { background: var(--t-yellow-bg); color: var(--t-yellow); }
.chip.c-brown { background: var(--t-brown-bg); color: var(--t-brown); }
.chip.c-pink { background: var(--t-pink-bg); color: var(--t-pink); }
.chip.c-red { background: var(--t-red-bg); color: var(--t-red); }
.chip.proj { background: transparent; border: 1px solid var(--line-2); color: var(--ink-2); }
.chip.proj .sdot { width: 6px; height: 6px; }

.due { font-family: var(--font); font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.due.over { color: var(--red); font-weight: 500; }
.due.today { color: var(--amber); font-weight: 500; }
.pri { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.pri.high { background: var(--red); } .pri.mid { background: var(--amber); } .pri.low { background: var(--ink-3); }
.progress { font-family: var(--font); font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--ink-3); }
.status-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }

.empty { color: var(--ink-3); padding: 18px 14px; font-size: 13px; }

/* 提案カード */
.proposal { padding: 16px 18px; display: grid; gap: 10px; }
.proposal + .proposal { border-top: 1px solid var(--line); }
.proposal-h { display: flex; gap: 10px; align-items: flex-start; }
.proposal-title { font-weight: 500; font-size: 15px; line-height: 1.45; flex: 1; min-width: 0; }
.proposal-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-3); }
.why { font-size: 13px; color: var(--ink-2); background: var(--paper-2); border-radius: 10px; padding: 8px 12px; }
.subs { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.subs li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13.5px; padding: 3px 0; }
.subs .n { font-family: var(--font); font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: 11.5px; text-align: right; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.conf { font-size: 11.5px; }

/* ボード */
.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; min-height: 200px; }
.col.drop { outline: 2px dashed var(--accent); outline-offset: -4px; }
.col-h { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; padding: 4px 6px 8px; color: var(--ink-2); }
.bcard { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin-bottom: 8px; cursor: grab; display: grid; gap: 6px; }
.bcard:hover { border-color: var(--line-2); }
.bcard .t { font-size: 13.5px; line-height: 1.45; }
.bcard .m { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* 案件ギャラリー */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.pcard { padding: 0; overflow: hidden; cursor: pointer; display: grid; text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 16px; }
.pcard:hover { border-color: var(--line-2); box-shadow: 0 6px 24px rgba(20,28,45,0.06); }
.pcard-top { height: 64px; position: relative; }
.pcard-top .pid { position: absolute; left: 14px; bottom: 8px; font-family: var(--font); font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--ink-2); background: var(--glass-strong); border-radius: 6px; padding: 0 6px; }
.pcard-body { padding: 12px 14px 14px; display: grid; gap: 8px; }
.pcard-name { font-weight: 700; font-size: 15px; line-height: 1.4; }
.pcard-kv { font-size: 12.5px; color: var(--ink-2); display: grid; gap: 2px; }
.pcard-counts { display: flex; gap: 12px; font-size: 12px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 8px; flex-wrap: wrap; }

.md pre { background: var(--paper-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; }
.md .tbl { overflow-x: auto; margin: 8px 0; }
.md table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
.md th, .md td { border: 1px solid var(--line-2); padding: 5px 9px; text-align: left; vertical-align: top; }

.md details { border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; margin: 8px 0; }

.bars { display: grid; gap: 6px; }

.app.solo { grid-template-columns: minmax(0, 1fr); }

@media (max-width: 1000px) {

}

  .tabbar {
    display: flex; position: fixed; z-index: 40; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    border-radius: 26px; padding: 6px; justify-content: space-around;

  .tabbar button svg { width: 22px; height: 22px; }
  .tabbar button.active { color: var(--accent); background: var(--accent-soft); }
  .fab {
    display: grid; place-items: center; position: fixed; z-index: 41; right: 18px; bottom: calc(86px + env(safe-area-inset-bottom, 0px));
    width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer; color: var(--accent);
  }
  .fab svg { width: 24px; height: 24px; }
  .drawer { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 88vh; }
  .row { grid-template-columns: 26px minmax(0, 1fr); }
  .row-end { grid-column: 2; justify-content: flex-start; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide 0.22s cubic-bezier(.2,.8,.2,1); }
  .modal, .palette { animation: pop 0.18s ease-out; }
}
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
@keyframes pop { from { opacity: 0; margin-top: 8px; } }

<script>
/* =========================================================================
   秘書AI ダッシュボード
   - Apps Script の Web アプリとして動くときは google.script.run 経由で db を読む
   - それ以外（ファイルを直接開いた場合など）はデモデータで動く
   ========================================================================= */

const ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  inbox: '<path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5.5 5h13l2.5 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/>',
  task: '<rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12 3 3 5-6"/>',

  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  gauge: '<path d="M4 18a8 8 0 1 1 16 0"/><path d="m12 18 4-6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',

  clip: '<path d="m20 11-8 8a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7L9.6 16.8a1.7 1.7 0 0 1-2.4-2.4L15 6.6"/>',
  out: '<path d="M7 17 17 7M8 7h9v9"/>',
  in: '<path d="M17 7 7 17M7 8v9h9"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  spark: '<path d="M12 3.5 13.8 9l5.7 1.8-5.7 1.8L12 18.5l-1.8-5.9L4.5 10.8 10.2 9z"/>',
  wait: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  building: '<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/>',
  doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  alert: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>',
  board: '<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11M4 6h.5M4 12h.5M4 18h.5"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  auto: '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/>',
};
const ic = (n, cls) => '<svg class="' + (cls || '') + '" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>';

/* ---------------- テーマ（自動 / ライト / ダーク） ---------------- */
const THEMES = { auto: ['auto', '自動（端末の設定に合わせる）'], light: ['sun', 'ライト'], dark: ['moon', 'ダーク'] };
const THEME_ORDER = ['auto', 'light', 'dark'];
let theme = 'auto';
try { theme = localStorage.getItem('secretary-theme') || 'auto'; } catch (e) {}
if (!THEMES[theme]) theme = 'auto';
function applyTheme() {
  // auto のときは属性を外し、CSS の prefers-color-scheme に任せる
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
}
applyTheme();

const CAT_COLOR = {
  '発注者対応': 'orange', '設計・監理者対応': 'purple', '行政・官公庁': 'blue', '協力会社・発注': 'brown', '工程・現場調整': 'pink',
  '安全・品質': 'red', '近隣対応': 'green', '見積・契約・出来高': 'yellow', '社内': 'gray', '情報共有': 'gray', 'その他': 'gray',
  '発注者打合せ': 'orange', '設計定例': 'purple', '行政協議・検査': 'blue', '工程会議・職長会': 'pink', '現場確認・検査': 'brown',
  '近隣説明': 'green', '社内会議': 'gray', '電話メモ': 'gray',
};
const DEFAULT_RECORD_TYPES = ['発注者打合せ', '設計定例', '行政協議・検査', '工程会議・職長会', '現場確認・検査', '近隣説明', '社内会議', '電話メモ', 'その他'];
const PROJ_COLORS = ['#2F6BE4', '#E07A2E', '#1D8A5B', '#8B5CC7', '#C2417A', '#0E8FA3', '#9C7A1C', '#5B6472'];
const STATUS = {
  proposed: { label: '提案中', color: 'var(--accent)' }, todo: { label: '未着手', color: 'var(--ink-3)' },
  doing: { label: '進行中', color: 'var(--amber)' }, waiting: { label: '相手待ち', color: '#8B5CC7' },
  done: { label: '完了', color: 'var(--green)' }, dismissed: { label: '却下', color: 'var(--ink-3)' },
};
const WEEK = '日月火水木金土';

/* ---------------- 状態 ---------------- */
const S = { db: null, demo: false, view: 'home', params: {}, taskMode: 'list', taskFilter: { project: '', owner: 'me' }, mailFilter: { project: '', category: '', dir: '' }, recFilter: { project: '', type: '' }, projFilter: '進行中' };

/* ---------------- API（Apps Script / デモ） ---------------- */
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
function gas(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(e && e.message ? e.message : e))[fn](...args);
  });
}
const API = {
  async getDb() { return IS_GAS ? JSON.parse(await gas('apiGetDb')) : sampleDb(); },
  async markdown(fileId) { return IS_GAS ? gas('apiGetMarkdown', fileId) : (DEMO_DOCS[fileId] || '# 見つかりません'); },
  async projectDoc(pid, kind) { return IS_GAS ? gas('apiGetProjectDoc', pid, kind) : demoProjectDoc(pid, kind); },
  async updateTask(id, patch) {
    if (IS_GAS) return JSON.parse(await gas('apiUpdateTask', id, patch));
    const t = S.db.tasks.find(x => x.id === id); Object.assign(t, patch);
    if (patch.subtasks) t.subtasks = patch.subtasks;
    if (patch.status === 'done') { t.doneAt = new Date().toISOString(); delete t.suggestDone; }
    if (patch.clearSuggestDone) delete t.suggestDone;
    return t;
  },
  async bulk(ids, status) {
    if (IS_GAS) return gas('apiBulkTasks', ids, status);
    ids.forEach(id => { const t = S.db.tasks.find(x => x.id === id); if (t) t.status = status; });
  },
  async createTask(input) {
    if (IS_GAS) return JSON.parse(await gas('apiCreateTask', input));
    const t = Object.assign({ id: 't-demo-' + Math.random().toString(36).slice(2, 7), status: 'todo', owner: 'me', priority: 'mid', subtasks: [], source: { kind: 'manual' }, createdAt: new Date().toISOString(), dueBasis: '手動登録' }, input);
    S.db.tasks.push(t); return t;
  },
  async submitMemo(input) {
    if (IS_GAS) return JSON.parse(await gas('apiSubmitMemo', input));
    const q = S.db.queue; q.pending++; q.byType.record = (q.byType.record || 0) + 1;
    return S.db;
  },
  async upload(input) { return IS_GAS ? gas('apiUploadRecord', input) : '（デモ）受け付けました。実際の環境では次回の解析で議事録になります。'; },
  async upsertProject(p) {
    if (IS_GAS) return JSON.parse(await gas('apiUpsertProject', p));
    let x = S.db.projects.find(q => q.id === p.id);
    if (!x) { x = { id: 'P-' + D(0).slice(0, 4) + '-0' + (S.db.projects.length + 1), openTasks: 0, overdue: 0, waiting: 0, proposed: 0, aliases: [], domains: [] }; S.db.projects.push(x); }
    Object.assign(x, p, { id: x.id }); return S.db;
  },
  async runNow() { return IS_GAS ? JSON.parse(await gas('apiRunNow')) : S.db; },
  async setupState() { return IS_GAS ? JSON.parse(await gas('apiGetSetupState')) : { ready: true, name: '', emails: '', role: 'ゼネコン・工務店の施工管理担当', hasGemini: false, rootUrl: '' }; },
  async saveSettings(input) { if (!IS_GAS) throw new Error('デモでは保存されません'); return JSON.parse(await gas('apiSaveSettings', input)); },
  async startBootstrap() { if (!IS_GAS) throw new Error('デモでは実行できません'); return JSON.parse(await gas('apiStartBootstrap')); },
};

/* ---------------- 汎用 ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function D(n) { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
const TODAY = () => ymd(new Date());
function toDate(s) { const p = String(s).slice(0, 10).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function md_(s) { if (!s) return ''; const d = toDate(s); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WEEK[d.getDay()] + ')'; }
function daysFrom(s) { return Math.round((toDate(s) - toDate(TODAY())) / 86400000); }
function dueHtml(due) {
  if (!due) return '<span class="due">期日なし</span>';
  const n = daysFrom(due);
  if (n < 0) return '<span class="due over">' + md_(due) + '・' + (-n) + '日超過</span>';
  if (n === 0) return '<span class="due today">今日</span>';
  if (n === 1) return '<span class="due">明日</span>';
  return '<span class="due">' + md_(due) + '</span>';
}
function isoLocal(s) { const d = new Date(s); if (isNaN(d)) return String(s || ''); return ymd(d) + 'T' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function timeOf(s) { const m = String(s || '').match(/T(\d{2}:\d{2})/); return m ? m[1] : ''; }
function proj(id) { return (S.db.projects || []).find(p => p.id === id); }
function projColor(id) { const i = (S.db.projects || []).findIndex(p => p.id === id); return i < 0 ? 'var(--ink-3)' : PROJ_COLORS[i % PROJ_COLORS.length]; }
function projChip(id) {

function catChip(c) { return c ? '<span class="chip c-' + (CAT_COLOR[c] || 'gray') + '">' + esc(c) + '</span>' : ''; }
function statusBadge(st) { const s = STATUS[st] || STATUS.todo; return '<span class="status-badge"><span class="sdot" style="background:' + s.color + '"></span>' + s.label + '</span>'; }
function subProgress(t) { const n = (t.subtasks || []).length; if (!n) return ''; return '<span class="progress">' + t.subtasks.filter(s => s.done).length + '/' + n + '</span>'; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2600); }
async function busy(label, fn) { toast(label); try { return await fn(); } catch (e) { toast('エラー: ' + e); throw e; } }

/* ---------------- Markdown（依存なしの簡易レンダラ） ---------------- */
function inlineMd(s) {
  let t = esc(s);
  t = t.replace(/ 🆔 [\w-]+/g, '');
  t = t.replace(/ 📅 (\d{4}-\d{2}-\d{2})/g, (m, d) => '<span class="due-inline">' + md_(d) + '</span>');
  t = t.replace(/ (⏫|🔼|🔽)/g, (m, p) => ' <span class="pri ' + ({ '⏫': 'high', '🔼': 'mid', '🔽': 'low' }[p]) + '" title="優先度"></span>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/\[\[([^\]]+)\]\]/g, '<strong>$1</strong>');
  return t;
}
function renderMd(src) {
  let text = String(src || '').replace(/\r\n/g, '\n');
  let fmHtml = '';
  const fm = text.match(/^---\n([\s\S]*?)\n---\n/);
  if (fm) {
    text = text.slice(fm[0].length);
    const pairs = fm[1].split('\n').map(l => l.match(/^(\w+):\s*"?(.*?)"?$/)).filter(Boolean).filter(m => ['type', 'conversation_id', 'source'].indexOf(m[1]) < 0);
    fmHtml = '<div class="fm">' + pairs.map(m => '<span class="chip">' + esc(m[1]) + ': ' + esc(m[2]) + '</span>').join('') + '</div>';
  }
  const lines = text.split('\n');
  const out = [];
  let i = 0;
  const listStack = [];
  const closeLists = (depth) => { while (listStack.length > depth) out.push('</' + listStack.pop().tag + '>'); };
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^(```|~~~)/);
    if (fence) {
      closeLists(0);
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith(fence[1])) buf.push(lines[i++]);
      i++; out.push('<pre>' + esc(buf.join('\n')) + '</pre>'); continue;
    }
    if (/^<details>/.test(line.trim())) { closeLists(0); const sm = line.match(/<summary>(.*?)<\/summary>/); out.push('<details><summary>' + esc(sm ? sm[1] : '詳細') + '</summary>'); i++; continue; }
    if (/^<\/details>/.test(line.trim())) { closeLists(0); out.push('</details>'); i++; continue; }
    if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      closeLists(0);
      const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(line); i += 2;
      const body = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) body.push(cells(lines[i++]));
      out.push('<div class="tbl"><table><thead><tr>' + head.map(h => '<th>' + inlineMd(h) + '</th>').join('') + '</tr></thead><tbody>' +
        body.map(r => '<tr>' + r.map(c => '<td>' + inlineMd(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeLists(0); out.push('<h' + h[1].length + '>' + inlineMd(h[2]) + '</h' + h[1].length + '>'); i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { closeLists(0); out.push('<hr>'); i++; continue; }
    if (/^>\s?/.test(line)) {
      closeLists(0); const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
      out.push('<blockquote>' + buf.map(inlineMd).join('<br>') + '</blockquote>'); continue;
    }
    const li = line.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
    if (li) {
      const depth = Math.floor(li[1].replace(/\t/g, '    ').length / 2) + 1;
      const tag = /\d/.test(li[2]) ? 'ol' : 'ul';
      if (listStack.length < depth) { while (listStack.length < depth) { out.push('<' + tag + '>'); listStack.push({ tag }); } }
      else closeLists(depth);
      const task = li[3].match(/^\[( |x|X)\]\s+(.*)$/);
      if (task) out.push('<li class="task' + (task[1] !== ' ' ? ' done' : '') + '"><span class="check' + (task[1] !== ' ' ? ' on' : '') + '"></span><span>' + inlineMd(task[2]) + '</span></li>');
      else out.push('<li>' + inlineMd(li[3]) + '</li>');
      i++; continue;
    }
    if (!line.trim()) { closeLists(0); i++; continue; }
    closeLists(0);
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*[-*+]\s|\s*\d+\.\s|>|```|~~~|\s*\||<\/?details)/.test(lines[i])) buf.push(lines[i++]);
    if (!buf.length) { buf.push(lines[i++]); }
    out.push('<p>' + buf.map(inlineMd).join('<br>') + '</p>');
  }
  closeLists(0);
  return '<div class="md">' + fmHtml + out.join('') + '</div>';
}

  const today = TODAY();
  let list = S.db.tasks.filter(t => ['todo', 'doing', 'waiting'].indexOf(t.status) >= 0 || (t.status === 'done' && daysFrom((t.doneAt || '').slice(0, 10) || today) >= -7));
  if (f.project) list = list.filter(t => t.projectId === f.project);
  const mine = list.filter(t => t.owner !== 'other');
  const others = list.filter(t => t.owner === 'other');
  const head = '<div class="page-head"><div class="page-icon" style="background:var(--green-soft);color:var(--green)">' + ic('task') + '</div><h1 class="page-title">タスク</h1>' +
    '<div class="page-sub">採用したタスクと相手待ちの一覧です。行をクリックすると詳細・サブタスクを編集できます。</div></div>' +
    '<div class="filters"><div class="seg"><button class="' + (S.taskMode === 'list' ? 'on' : '') + '" data-act="task-mode" data-mode="list">リスト</button><button class="' + (S.taskMode === 'board' ? 'on' : '') + '" data-act="task-mode" data-mode="board">ボード</button></div>' +
    projectSelect('task-filter-project', f.project) +
    '<div class="seg"><button class="' + (f.owner === 'me' ? 'on' : '') + '" data-act="task-owner" data-owner="me">自分</button><button class="' + (f.owner === 'other' ? 'on' : '') + '" data-act="task-owner" data-owner="other">相手待ち <span class="num">' + others.length + '</span></button></div>' +
    '<div class="spacer"></div><button class="btn sm" data-act="new-task">' + ic('plus') + 'タスク</button></div>';

  if (S.taskMode === 'board') {
    const cols = [['todo', '未着手'], ['doing', '進行中'], ['waiting', '相手待ち'], ['done', '完了（直近7日）']];
    return '<div class="page" style="max-width:1200px">' + head + '<div class="board">' + cols.map(c => {
      const items = list.filter(t => t.status === c[0]).sort(byDue);
      return '<div class="col" data-drop="' + c[0] + '"><div class="col-h"><span class="sdot" style="background:' + STATUS[c[0]].color + '"></span>' + c[1] + ' <span class="num" style="color:var(--ink-3)">' + items.length + '</span></div>' +
        items.map(t => '<div class="bcard" draggable="true" data-drag="' + t.id + '" data-act="open-task" data-id="' + t.id + '"><div class="t">' + esc(t.title) + '</div><div class="m">' + projChip(t.projectId) + dueHtml(t.due) + subProgress(t) + '</div></div>').join('') + '</div>';
    }).join('') + '</div></div>';
  }

  const src = f.owner === 'other' ? others.filter(t => t.status === 'waiting') : mine.filter(t => t.status !== 'done');
  const groups = [
    ['期限切れ', t => t.due && t.due < today],
    ['今日', t => t.due === today],
    ['明日', t => t.due && daysFrom(t.due) === 1],
    ['今週〜7日以内', t => t.due && daysFrom(t.due) > 1 && daysFrom(t.due) <= 7],
    ['それ以降', t => t.due && daysFrom(t.due) > 7],
    ['期日なし', t => !t.due],
  ];
  const doneList = f.owner === 'me' ? mine.filter(t => t.status === 'done') : [];
  return '<div class="page">' + head + '<div class="card">' +
    groups.map(g => {
      const items = src.filter(g[1]).sort(byDue);
      if (!items.length) return '';
      return '<div class="group-h">' + g[0] + '<span class="n">' + items.length + '</span></div><div class="rows">' + items.map(taskRow).join('') + '</div>';
    }).join('') + (src.length ? '' : '<div class="empty">該当するタスクはありません。</div>') +
    (doneList.length ? '<div class="group-h">完了（直近7日）<span class="n">' + doneList.length + '</span></div><div class="rows">' + doneList.map(taskRow).join('') + '</div>' : '') +
    '</div></div>';
};

async function afterRender() {
  if (S.view === 'project') {
    const tab = S.params.tab || 'overview';
    if (['overview', 'decisions', 'attachments'].indexOf(tab) >= 0) {
      const slot = $('#doc-slot');
      try {
        const md = await API.projectDoc(S.params.id, tab);
        if (slot && S.view === 'project') slot.innerHTML = md ? '<div class="card pad">' + renderMd(md) + '</div>' : '<div class="empty">' + ({ overview: 'カルテは毎朝、動きのあった案件について作成・更新されます。', decisions: 'まだ決定事項はありません。', attachments: 'まだ添付はありません。' }[tab]) + '</div>';
      } catch (e) { if (slot) slot.innerHTML = '<div class="empty">読み込めませんでした: ' + esc(e) + '</div>'; }
    }
  }
  if (S.view === 'tasks' && S.taskMode === 'board') bindBoard();
}

function bindBoard() {
  document.querySelectorAll('[data-drag]').forEach(el => el.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', el.dataset.drag); }));
  document.querySelectorAll('[data-drop]').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave', () => col.classList.remove('drop'));
    col.addEventListener('drop', async e => {
      e.preventDefault(); col.classList.remove('drop');
      const id = e.dataTransfer.getData('text/plain');
      await setTask(id, { status: col.dataset.drop });
    });
  });
}

async function setTask(id, patch) {
  const t = await API.updateTask(id, patch);
  const i = S.db.tasks.findIndex(x => x.id === id);
  if (i >= 0) S.db.tasks[i] = t;
  recount();
  render();
  return t;
}
function recount() {
  const today = TODAY();
  S.db.projects.forEach(p => {
    const ts = S.db.tasks.filter(t => t.projectId === p.id);
    const open = ts.filter(t => t.status === 'todo' || t.status === 'doing');
    p.openTasks = open.length; p.overdue = open.filter(t => t.due && t.due < today).length;
    p.waiting = ts.filter(t => t.status === 'waiting').length; p.proposed = ts.filter(t => t.status === 'proposed').length;
  });
}

        '<div class="row-main"><input class="inp" style="border-color:transparent;background:transparent;padding:2px 4px" data-sub-title="' + i + '" value="' + esc(s.title) + '"></div><div class="row-end"><input class="inp" type="date" style="width:150px" data-sub-due="' + i + '" value="' + esc(s.due || '') + '"></div></div>').join('') +

    '</div></div>' +
    (t.source && t.source.id ? '<div class="section"><a href="#" data-act="open-source" data-id="' + t.id + '">' + ic('doc', '') + ' 出典: ' + esc(t.source.title || '') + '</a></div>' : '') +

      (t.status === 'proposed' ? '<button class="btn primary" data-act="save-task" data-id="' + t.id + '" data-accept="1">保存して採用</button>' : '<button class="btn primary" data-act="save-task" data-id="' + t.id + '">保存</button>') +
      (t.status !== 'done' ? '<button class="btn" data-act="save-task" data-id="' + t.id + '" data-done="1">完了にする</button>' : '') +
      '<button class="btn ghost" data-act="close">閉じる</button></div>');
  $('#new-sub').addEventListener('keydown', e => {

    t.subtasks = (t.subtasks || []).concat([{ id: 's' + ((t.subtasks || []).length + 1), title: e.target.value.trim(), due: '', done: false }]);
    saveTaskFromDrawer(t.id, {}).then(() => taskDrawer(t.id));
  });
}

function collectSubs(t) {
  return (t.subtasks || []).map((s, i) => {
    const ti = document.querySelector('[data-sub-title="' + i + '"]');
    const du = document.querySelector('[data-sub-due="' + i + '"]');
    return Object.assign({}, s, { title: ti ? ti.value : s.title, due: du ? du.value : s.due });
  });
}
async function saveTaskFromDrawer(id, extra) {

  return setTask(id, patch);
}

function openPalette() {
  $('#overlay').innerHTML = '<div class="scrim" data-act="close"></div><div class="palette glass" role="dialog" aria-label="検索"><input id="pal-q" placeholder="タスク・案件・メール・記録・決定事項を検索" autocomplete="off"><div class="palette-list" id="pal-list"></div></div>';
  const q = $('#pal-q');
  q.focus();
  const run = () => {
    const s = q.value.trim().toLowerCase();
    const hit = x => !s || x.toLowerCase().indexOf(s) >= 0;
    const groups = [
      ['案件', S.db.projects.filter(p => hit(p.name + p.id + (p.client || '') + (p.aliases || []).join(' '))).slice(0, 5).map(p => ({ act: 'open-project', id: p.id, t: p.name, s: p.id }))],
      ['タスク', S.db.tasks.filter(t => t.status !== 'dismissed' && hit(t.title + (t.why || ''))).slice(0, 8).map(t => ({ act: 'open-task', id: t.id, t: t.title, s: STATUS[t.status].label + (t.due ? ' · ' + md_(t.due) : '') }))],
      ['記録', S.db.records.filter(r => hit(r.title + r.summary + (r.counterpart || ''))).slice(0, 5).map(r => ({ act: 'open-record', id: r.id, t: r.title, s: r.type + ' · ' + md_(r.date) }))],
      ['メール', S.db.mails.filter(m => hit(m.title + m.subject + m.summary + m.from + (m.attachments || []).map(a => a.name + (a.drawingNo || '')).join(' '))).slice(0, 8).map(m => ({ act: 'open-mail', id: m.id, t: m.title, s: md_(m.date) }))],
      ['決定事項', S.db.decisions.filter(d => hit(d.text)).slice(0, 5).map(d => ({ act: 'open-project', id: d.projectId, t: d.text, s: md_(d.date) }))],
    ].filter(g => g[1].length);
    $('#pal-list').innerHTML = groups.length ? groups.map(g => '<div class="pal-group">' + g[0] + '</div>' + g[1].map(it => '<div class="pal-item" data-act="' + it.act + '" data-id="' + esc(it.id) + '"><span class="t">' + esc(it.t) + '</span><span class="s">' + esc(it.s) + '</span></div>').join('')).join('') : '<div class="empty">見つかりませんでした。</div>';
    const first = $('#pal-list .pal-item'); if (first) first.classList.add('sel');
  };
  q.addEventListener('input', run);
  q.addEventListener('keydown', e => {
    const items = Array.from(document.querySelectorAll('.pal-item'));
    let i = items.findIndex(x => x.classList.contains('sel'));
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (i >= 0) items[i].classList.remove('sel');
      i = e.key === 'ArrowDown' ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1);
      if (items[i]) { items[i].classList.add('sel'); items[i].scrollIntoView({ block: 'nearest' }); }
    }
    if (e.key === 'Enter' && items[i] && !e.isComposing) items[i].click();
  });
  run();
}

/* ---------------- イベント ---------------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
  // 行の中のボタン・チップは行のクリックより優先
  if (act !== 'close') e.stopPropagation();
  switch (act) {
    case 'theme':
      theme = THEME_ORDER[(THEME_ORDER.indexOf(theme) + 1) % THEME_ORDER.length];
      try { localStorage.setItem('secretary-theme', theme); } catch (e) {}
      applyTheme(); renderShell(); toast('テーマ: ' + THEMES[theme][1]);
      break;
    case 'nav':
      closeOverlay();
      if (el.dataset.view === 'tasks-waiting') { S.taskFilter.owner = 'other'; S.taskMode = 'list'; go('tasks'); }
      else { if (el.dataset.view === 'tasks') S.taskFilter.owner = 'me'; go(el.dataset.view); }
      break;
    case 'close': if (e.target === el || el.classList.contains('icon-btn') || el.classList.contains('btn')) closeOverlay(); break;
    case 'search': openPalette(); break;
    case 'open-project': closeOverlay(); if (id && id !== 'GENERAL') go('project', { id }); break;
    case 'proj-tab': go('project', { id: S.params.id, tab: el.dataset.tab }); break;
    case 'open-task': taskDrawer(id); break;
    case 'open-mail': mailDrawer(id); break;
    case 'open-record': { const r = S.db.records.find(x => x.id === id); if (r) docDrawer(r.fileId, r.title); break; }
    case 'open-doc': docDrawer(el.dataset.file, el.dataset.title); break;
    case 'open-source': {
      const t = S.db.tasks.find(x => x.id === id);
      if (t && t.source.kind === 'mail') mailDrawer(t.source.id);
      else if (t && t.source.kind === 'record') { const r = S.db.records.find(x => x.id === t.source.id); if (r) docDrawer(r.fileId, r.title); }
      break;
    }
    case 'toggle-task': { const t = S.db.tasks.find(x => x.id === id); await setTask(id, { status: t.status === 'done' ? 'todo' : 'done' }); toast(t.status === 'done' ? '未完了に戻しました' : '完了にしました'); break; }
    case 'toggle-sub': {
      const t = S.db.tasks.find(x => x.id === id); const subs = collectSubs(t); subs[+el.dataset.i].done = !subs[+el.dataset.i].done;
      await saveTaskFromDrawer(id, { subtasks: subs }); taskDrawer(id); break;
    }
    case 'save-task': {
      const extra = el.dataset.accept ? { status: 'todo' } : el.dataset.done ? { status: 'done' } : {};
      await saveTaskFromDrawer(id, extra); closeOverlay(); toast(el.dataset.accept ? '採用しました' : el.dataset.done ? '完了にしました' : '保存しました'); break;
    }
    case 'accept': await setTask(id, { status: 'todo' }); toast('採用しました'); break;
    case 'dismiss': await setTask(id, { status: 'dismissed' }); toast('却下しました'); break;
    case 'accept-all': { const ids = proposed().map(t => t.id); await busy('採用しています…', () => API.bulk(ids, 'todo')); ids.forEach(i => { S.db.tasks.find(t => t.id === i).status = 'todo'; }); recount(); render(); toast(ids.length + '件を採用しました'); break; }
    case 'done-yes': await setTask(id, { status: 'done' }); toast('完了にしました'); break;
    case 'done-no': await setTask(id, { clearSuggestDone: true }); break;
    case 'proj-accept': S.db = await API.upsertProject({ id, status: '進行中' }); render(); toast('案件として登録しました'); break;
    case 'proj-reject': S.db = await API.upsertProject({ id, status: '保留' }); render(); toast('保留にしました'); break;
    case 'proj-filter': S.projFilter = el.dataset.status; render(); break;
    case 'task-mode': S.taskMode = el.dataset.mode; render(); break;
    case 'task-owner': S.taskFilter.owner = el.dataset.owner; S.taskMode = 'list'; render(); break;
    case 'mail-dir': S.mailFilter.dir = el.dataset.dir; render(); break;
    case 'new-task': newTaskModal(); break;
    case 'create-task': {
      const title = $('#n-title').value.trim(); if (!title) return;
      const t = await API.createTask({ title, due: $('#n-due').value, priority: $('#n-pri').value, projectId: $('#n-proj').value || 'GENERAL' });
      if (!S.db.tasks.find(x => x.id === t.id)) S.db.tasks.push(t);
      recount(); closeOverlay(); render(); toast('追加しました'); break;
    }
    case 'add-record': recordModal(); break;
    case 'rec-mode': {
      recordModal.mode = el.dataset.mode;
      el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el));
      $('#r-text-wrap').hidden = recordModal.mode !== 'text'; $('#r-file-wrap').hidden = recordModal.mode !== 'file'; break;
    }
    case 'submit-record': {
      const base = { type: $('#r-type').value, date: $('#r-date').value, projectId: $('#r-proj').value || 'GENERAL', title: $('#r-title').value.trim() };
      if (recordModal.mode === 'text') {
        const text = $('#r-text').value.trim(); if (!text) { toast('メモを入力してください'); return; }
        el.disabled = true; el.textContent = '登録しています…';
        try { S.db = await API.submitMemo(Object.assign(base, { text })); closeOverlay(); go('records'); toast('受け付けました。次回の解析で議事録になります'); }
        catch (err) { el.disabled = false; el.textContent = '登録する'; toast('エラー: ' + err); }
      } else {
        const f = recordModal.file; if (!f) { toast('ファイルを選んでください'); return; }
        if (f.size > 45 * 1024 * 1024) { toast('45MB を超えるファイルは Google Drive の 00_inbox/records に直接入れてください'); return; }
        el.disabled = true; el.textContent = 'アップロード中…';
        const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
        try { const msg = await API.upload(Object.assign(base, { name: f.name, mimeType: f.type, base64: b64 })); closeOverlay(); toast(msg); }
        catch (err) { el.disabled = false; el.textContent = '登録する'; toast('エラー: ' + err); }
      }
      break;
    }
    case 'settings': settingsModal(); break;
    case 'save-settings': {
      const input = { name: $('#st-name').value, emails: $('#st-emails').value, role: $('#st-role').value, geminiKey: $('#st-gemini').value };
      el.disabled = true; el.textContent = '保存しています…（初回は1分ほど）';
      try {
        S.setup = await API.saveSettings(input);
        if (el.dataset.first) {
          S.db = await API.getDb();
          ['#sidebar', '#topbar', '#tabbar', '#fab'].forEach(q => { $(q).hidden = false; });
          document.querySelector('.app').classList.remove('solo');
          go('home'); toast('初期設定が終わりました');
        } else { closeOverlay(); toast('保存しました'); }
      } catch (err) { el.disabled = false; el.textContent = el.dataset.first ? '保存して開始する' : '保存'; toast('エラー: ' + err); }
      break;
    }
    case 'start-bootstrap': {
      el.disabled = true;
      try { S.db = await busy('過去メールから解析ジョブを作っています…', () => API.startBootstrap()); render(); toast('初期分析のジョブを作りました。ルーチンが順に処理します'); }
      catch (err) { el.disabled = false; toast('エラー: ' + err); }
      break;
    }
    case 'edit-project': projectModal(id); break;
    case 'save-project': {
      const input = { id: id || undefined, name: $('#p-name').value.trim(), status: $('#p-status').value, phase: $('#p-phase').value, client: $('#p-client').value.trim(), location: $('#p-loc').value.trim(),
        aliases: $('#p-alias').value.split(/[,、]/).map(s => s.trim()).filter(Boolean), domains: $('#p-dom').value.split(/[,、\s]/).map(s => s.trim()).filter(Boolean) };
      if (!input.name) { toast('案件名を入力してください'); return; }
      S.db = await API.upsertProject(input); closeOverlay(); render(); toast('保存しました'); break;
    }
    case 'run-now': { el.disabled = true; S.db = await busy('解析結果を取り込んでいます…', () => API.runNow()); render(); toast('取り込みました（解析待ち ' + ((S.db.queue || {}).pending || 0) + ' 件）'); break; }
  }
});

document.addEventListener('change', e => {
  const k = e.target.dataset.change;
  if (!k) return;
  if (k === 'task-filter-project') S.taskFilter.project = e.target.value;
  else if (k === 'rec-filter-project') S.recFilter.project = e.target.value;
  else if (k === 'rec-filter-type') S.recFilter.type = e.target.value;
  else if (k === 'mail-filter-project') S.mailFilter.project = e.target.value;
  else if (k === 'mail-filter-cat') S.mailFilter.category = e.target.value;
  else return;
  render();
});

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
  if (e.key === 'Escape') closeOverlay();
});
